<style>
:root{
--bg:#f2efe5;
--paper:#fffdf7;

--ink2:#35342f;

}

*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Noto Sans SC',sans-serif;
background:radial-gradient(circle at 12% 6%,rgba(217,246,80,.28),transparent 18rem),linear-gradient(rgba(23,23,19,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,19,.035) 1px,transparent 1px),var(--bg);
background-size:auto,48px 48px,48px 48px,auto;
color:var(--ink);
line-height:1.7;
}
.container{max-width:1100px;margin:auto;padding:0 40px}

nav{
height:58px;
position:fixed;
top:0;left:0;right:0;
background:rgba(242,239,229,.92);
backdrop-filter:blur(12px);
border-bottom:2px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 48px;
z-index:20;
}
.logo{
font-family:'Noto Serif SC';
font-weight:900;
color:var(--ink);
letter-spacing:.05em;
}
.nav-right{
font-family:'JetBrains Mono';
font-size:11px;
color:var(--muted)
}

.hero{
padding:132px 0 84px;
text-align:center;
background:var(--bg);
border-bottom:4px solid var(--border);
position:relative;
overflow:hidden;
}
.wordcloud{
position:absolute;
inset:0;
pointer-events:none;
z-index:0;
}
.wordcloud span{
position:absolute;
font-family:'Noto Serif SC',serif;
font-weight:700;
color:rgba(23,23,19,.06);
white-space:nowrap;
animation:float 18s infinite ease-in-out;
}
.wordcloud span:nth-child(1){top:15%;left:3%;font-size:14px;animation-delay:0s;animation-duration:16s}
.wordcloud span:nth-child(2){top:50%;left:6%;font-size:28px;animation-delay:-4s;animation-duration:22s}
.wordcloud span:nth-child(3){top:70%;left:8%;font-size:18px;animation-delay:-8s;animation-duration:14s}
.wordcloud span:nth-child(4){top:10%;right:5%;font-size:32px;animation-delay:-2s;animation-duration:20s}
.wordcloud span:nth-child(5){top:35%;right:3%;font-size:16px;animation-delay:-6s;animation-duration:18s}
.wordcloud span:nth-child(6){top:60%;right:7%;font-size:24px;animation-delay:-10s;animation-duration:16s}
.wordcloud span:nth-child(7){top:80%;right:4%;font-size:13px;animation-delay:-3s;animation-duration:24s}
.wordcloud span:nth-child(8){top:20%;left:50%;font-size:20px;animation-delay:-7s;animation-duration:19s}
.wordcloud span:nth-child(9){top:75%;left:35%;font-size:15px;animation-delay:-1s;animation-duration:21s}
.wordcloud span:nth-child(10){top:45%;right:25%;font-size:26px;animation-delay:-9s;animation-duration:17s}
.wordcloud span:nth-child(11){top:5%;left:25%;font-size:22px;animation-delay:-5s;animation-duration:23s}
.wordcloud span:nth-child(12){top:85%;right:40%;font-size:14px;animation-delay:-11s;animation-duration:15s}
@keyframes float{
0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:.45}
25%{transform:translateY(-20px) translateX(8px) scale(1.05);opacity:.75}
50%{transform:translateY(-10px) translateX(-6px) scale(.95);opacity:.35}
75%{transform:translateY(-30px) translateX(4px) scale(1.02);opacity:.65}
}
.badge{
display:inline-flex;
gap:8px;
align-items:center;
padding:7px 18px;
border-radius:0;
background:var(--gold-bg);
border:1px solid var(--ink);
font-family:'JetBrains Mono';
font-size:11px;
color:var(--gold);
box-shadow:4px 4px 0 var(--ink);
margin-bottom:30px;
}
.badge i{
width:7px;height:7px;
border-radius:50%;
background:var(--coral)
}
.hero h1{
font-family:'Noto Serif SC';
font-size:clamp(42px,6vw,72px);
line-height:1.02;
font-weight:900;
letter-spacing:-.03em;
}
.hero h1 span{color:var(--gold)}
.hero p{
max-width:700px;
margin:28px auto;
font-size:18px;
color:var(--ink2)
}

.search-area{margin-top:-35px;position:relative;z-index:10}
.search-box{
background:var(--paper);
border:2px solid var(--ink);
padding:24px;
border-radius:0;
display:flex;
gap:12px;
flex-wrap:wrap;
box-shadow:9px 9px 0 var(--ink);
position:relative;
z-index:10
}
.btns-row{display:flex;gap:12px}
.btns-row button{flex:1;white-space:nowrap}
#readableBtn{background:var(--lime);box-shadow:4px 4px 0 var(--ink)}
#readableBtn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.search-box input{
flex:1;
border:1px solid var(--ink);
outline:none;
background:var(--bg);
padding:14px 18px;
font-size:16px;
border-radius:0;
}
.search-box button{
border:2px solid var(--ink);
background:var(--gold);
color:var(--ink);
font-weight:900;
padding:14px 36px;
border-radius:0;
cursor:pointer;
box-shadow:4px 4px 0 var(--ink)
}
.btns-row button{padding:14px 14px}

.process{
margin:40px 0;
display:grid;
grid-template-columns:repeat(4,1fr);
background:var(--paper);
border:2px solid var(--ink)
}
.step{
padding:22px;
border-right:1px solid var(--ink)
}
.step:last-child{border:0}
.num{
font-family:'JetBrains Mono';
font-size:12px;
color:var(--coral)
}
.step p{
font-size:13px;
color:var(--muted)
}

.status,.error{
display:none;
text-align:center;
padding:25px;
}
.status.show,.error.show{display:block}
.spinner{
display:inline-block;
width:18px;height:18px;
border:2px solid #ddd;
border-top-color:var(--gold);
border-radius:50%;
animation:spin .8s linear infinite;
vertical-align:middle
}
@keyframes spin{to{transform:rotate(360deg)}}
.error{
background:#fde8e3;
color:var(--red);
border:1px solid var(--ink);
border-radius:0
}

.report{display:none;margin:50px 0}
.report.show{display:block}
.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}
.toolbar button{
padding:8px 18px;
border:1px solid var(--ink);
background:var(--paper);
border-radius:0;
cursor:pointer
}
.report-content{
background:var(--paper);
border:2px solid var(--ink);
padding:60px 70px;
border-radius:0
}
.report-content.readable-view{padding:0;overflow:hidden;background:#f2efe5;border:2px solid var(--ink)}
.readable-outline{background:linear-gradient(rgba(23,23,19,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(23,23,19,.035) 1px,transparent 1px),#f2efe5;background-size:42px 42px;padding:clamp(24px,5vw,58px)}
.readable-kicker{display:inline-block;padding:7px 10px;background:var(--ink);color:#fff;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.08em}
.readable-outline h2{max-width:780px;margin:16px 0 12px!important;border:0!important;padding:0!important;font-size:clamp(30px,5vw,56px)!important;line-height:1.05}
.readable-decision{max-width:760px;margin:0 0 28px;padding:15px 18px;border-left:5px solid #EF5C4D;background:#fffdf7;font-weight:700}
.outline-signals{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin:26px 0 30px}.outline-signal{min-height:118px;padding:17px;border-right:1px solid var(--ink);background:#fffdf7}.outline-signal:last-child{border:0}.outline-signal em{display:block;font-style:normal;font:700 11px 'JetBrains Mono',monospace;color:var(--muted)}.outline-signal strong{display:block;margin:7px 0;font-size:22px}.outline-signal p{margin:0;color:var(--muted);font-size:12px}.outline-sections{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0 0 32px;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}.outline-section{padding:14px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:rgba(255,253,247,.88)}.outline-section small{display:block;color:#EF5C4D;font:700 10px 'JetBrains Mono',monospace}.outline-section b{font-size:15px}.open-readable{display:inline-flex;align-items:center;gap:12px;padding:15px 21px;border:2px solid var(--ink);background:#d9f650;box-shadow:6px 6px 0 var(--ink);color:var(--ink);font-weight:800;cursor:pointer}.open-readable:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
@media(max-width:600px){.outline-signals{grid-template-columns:1fr}.outline-signal{border-right:0;border-bottom:1px solid var(--ink)}.outline-signal:last-child{border-bottom:0}.outline-sections{grid-template-columns:1fr}}
.report-content h1,
.report-content h2{
font-family:'Noto Serif SC';
}
.report-content h1{
font-size:38px;
margin:30px 0
}
.report-content h2{
font-size:25px;
border-bottom:1px solid var(--border);
padding-bottom:10px;
margin:35px 0 15px
}
.report-content table{
width:100%;
border-collapse:collapse;
margin:20px 0
}
.report-content td,
.report-content th{
border:1px solid var(--border);
padding:10px
}
.report-content th{background:#F5F2EA}
.report-content blockquote{
border-left:4px solid var(--gold);
padding-left:20px;
color:var(--muted)
}

@media(max-width:700px){
.container{padding:0 16px}
.search-box{flex-direction:column}
.btns-row{width:100%}
.btns-row button{padding:13px 8px;font-size:13px}
.process{grid-template-columns:1fr}
.report-content{padding:30px 20px}
.readable-frame{min-height:720px}
nav{padding:0 16px}
}
</style>
</head>

<body>

<nav>
<div class="logo">trend_grab</div>
<div class="nav-right" style="display:flex;align-items:center;gap:16px">
<span id="quotaDisplay" style="font-size:11px;color:var(--gold);display:none"></span>

</div>
</nav>

<section class="hero">
<div class="wordcloud">
  <span>解压玩具</span><span>3D打印饰品</span><span>不锈钢饰品</span><span>AI硬件</span>
  <span>平价饰品</span><span>宠物用品</span><span>香薰蜡烛</span><span>跨境电商</span>
  <span>家居收纳</span><span>潮玩盲盒</span><span>户外露营</span><span>美妆工具</span>
</div>
<div class="container" style="position:relative;z-index:1">
<div class="badge"><i></i> FACTORY BRIEF / INDUSTRY RESEARCH</div>

<h1>
发现下一个<br>
<span>产业增长机会</span>
</h1>

<p>
AI自动搜索全球行业信息，
生成工厂接单研判网页版，覆盖市场、价格、供应链与接单风险
</p>
</div>

<div class="container">

<div class="search-area">

<div class="search-box">
<input id="industryInput"
placeholder="输入行业名称，例如：3D打印饰品、解压玩具、AI硬件">

<button id="readableBtn" onclick="generateReadable()">生成网页版</button>
</div>
</div>

<div class="step"><div class="num">01</div><b>资料搜索</b><p>全球信息采集</p></div>
<div class="step"><div class="num">02</div><b>深度分析</b><p>趋势与竞争研究</p></div>

</div>

</div>

<script>
let currentIndustry='';
let currentReport='';
let currentReadableUrl='';
let currentReportKind='markdown';

function resetMarkdownMode(){
currentReadableUrl='';
currentReportKind='markdown';
document.getElementById('htmlBtn').textContent='生成 HTML';
document.getElementById('reportContent').classList.remove('readable-view');
}

function showReadableOutline(industry, data){
currentIndustry=industry;
currentReport='';
currentReadableUrl=data.url;
currentReportKind='readable';
document.getElementById('reportTitle').textContent=industry+' · 工厂接单研判页';
const content=document.getElementById('reportContent');
content.classList.add('readable-view');
content.replaceChildren();
const outline=data.outline||{};
const panel=document.createElement('section');
panel.className='readable-outline';
const kicker=document.createElement('span'); kicker.className='readable-kicker'; kicker.textContent='工厂接单研判页 / 生成完成'; panel.appendChild(kicker);
const title=document.createElement('h2'); title.textContent=outline.headline||industry+' · 工厂接单研判'; panel.appendChild(title);
const decision=document.createElement('p'); decision.className='readable-decision'; decision.textContent=outline.decision||'请打开完整页面查看资料线索与待核实项。'; panel.appendChild(decision);
const signals=document.createElement('div'); signals.className='outline-signals';
(outline.signals||[]).forEach(item=>{const cell=document.createElement('article'); cell.className='outline-signal'; const name=document.createElement('em');name.textContent=item.name||'信号';const value=document.createElement('strong');value.textContent=item.value||'待验证';const note=document.createElement('p');note.textContent=item.note||'';cell.append(name,value,note);signals.appendChild(cell)}); panel.appendChild(signals);
const sections=document.createElement('div'); sections.className='outline-sections';
(outline.sections||[]).forEach(item=>{const cell=document.createElement('div');cell.className='outline-section';const eyebrow=document.createElement('small');eyebrow.textContent=item.eyebrow||'';const sectionTitle=document.createElement('b');sectionTitle.textContent=item.title||'';cell.append(eyebrow,sectionTitle);sections.appendChild(cell)}); panel.appendChild(sections);
const open=document.createElement('button');open.className='open-readable';open.type='button';open.textContent='打开完整工厂接单研判页  →';open.addEventListener('click',()=>{window.location.href=data.url});panel.appendChild(open);
content.appendChild(panel);
document.getElementById('htmlBtn').textContent='下载 HTML';
}

async function generateReadable(){
const industry=document.getElementById('industryInput').value.trim();
if(!industry)return;
if(!myCode){alert('请先登录');return;}

const btn=document.getElementById('readableBtn');
const status=document.getElementById('status');
const error=document.getElementById('error');
const report=document.getElementById('report');
const statusText=document.getElementById('statusText');
const timerEl=document.getElementById('timer');
btn.disabled=true;
status.classList.add('show');
error.classList.remove('show');
report.classList.remove('show');
document.getElementById('eta').textContent='正在检查深度报告…';

const started=Date.now();
let phases=[];
let phaseIndex=0;
let totalSeconds=780;
let progressTimer=null;

async function startProgress(hasDeep){
  if(hasDeep){
    totalSeconds=180;
    phases=[{label:'深度报告已存在，开始生成网页版',sec:20},{label:'从深度报告提炼工厂接单线索',sec:100},{label:'配图与排版',sec:60}];
    document.getElementById('eta').textContent='预计 3 分钟（深度报告已存在）';
  }else{
    totalSeconds=780;
    phases=[{label:'生成深度报告（约10分钟）',sec:600},{label:'从深度报告提炼工厂接单线索',sec:120},{label:'配图与排版',sec:60}];
    document.getElementById('eta').textContent='预计 13 分钟（需先生成深度报告）';
  }
  statusText.textContent='阶段 1/'+phases.length+'：'+phases[0].label;
  progressTimer=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-started)/1000);
    let acc=0,next=phaseIndex;
    for(let i=0;i<phases.length;i++){
      acc+=phases[i].sec;
      if(elapsed<acc){next=i;break;}
      next=i;
    }
    if(next!==phaseIndex){
      phaseIndex=next;
      statusText.textContent='阶段 '+(phaseIndex+1)+'/'+phases.length+'：'+phases[phaseIndex].label;
    }
    const left=Math.max(0,totalSeconds-elapsed);
    timerEl.textContent='剩余 '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  },1000);
}

(async()=>{
  try{
    const r=await fetch('/api/check-cache?industry='+encodeURIComponent(industry));
    const d=await r.json();
    await startProgress(!!(d&&d.exists));
  }catch(e){
    await startProgress(false);
  }
})();

try{
  const resp=await fetch('/api/generate-readable',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({industry,code:myCode})
  });
  const body=await resp.text();
  let data;
  try{data=JSON.parse(body)}catch(_){throw new Error(body.substring(0,200)||'服务器返回异常')}
  if(!resp.ok)throw new Error(data.detail||'生成失败');

  showReadableOutline(industry,data);
  if(data.web_left!==undefined){
    document.getElementById('quotaDisplay').textContent='网页版'+data.web_left+'次';
  }
  report.classList.add('show');
  setTimeout(()=>document.getElementById('reportContent').scrollIntoView({behavior:'smooth',block:'start'}),200);
}catch(e){
  error.textContent=e.message;
  error.classList.add('show');
}finally{
  clearInterval(progressTimer);
  timerEl.textContent='';
  document.getElementById('eta').textContent='';
  status.classList.remove('show');
  btn.disabled=false;
}
}


async function downloadReport(format){

if(!currentReport && !currentReadableUrl)return;

if(currentReportKind==='readable'){
  if(format==='md'){
    alert('工厂接单研判页是图文 HTML 页面，请下载 HTML。');
    return;
  }
  const response=await fetch(currentReadableUrl);
  if(!response.ok)throw new Error('工厂接单研判页文件不存在，请重新生成。');
  let blob=new Blob([await response.text()],{type:'text/html'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=currentIndustry+'_工厂接单研判.html';
  a.click();
  URL.revokeObjectURL(a.href);
  return;
}

if(format==='md'){

let blob=new Blob([currentReport],
{type:'text/markdown'});

let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=currentIndustry+'_白皮书.md';
a.click();

return;
}


let btn=document.getElementById('htmlBtn');
btn.disabled=true;
btn.textContent='生成中…';
btn.style.opacity='0.5';

let timerEl=document.getElementById('timer');
let htmlStart=Date.now();
let htmlTimer=setInterval(()=>{
  let s=Math.floor((Date.now()-htmlStart)/1000);
  let m=Math.floor(s/60),sec=s%60;
  timerEl.textContent='HTML '+m+':'+(sec<10?'0':'')+sec;
  timerEl.style.display='block';
},1000);
timerEl.textContent='HTML 0:00';
timerEl.style.display='block';

try {
let resp=await fetch('/api/export-html',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
markdown:currentReport,
industry:currentIndustry
})
});

const respText = await resp.text();
let data;
try { data = JSON.parse(respText); } catch(e) {
  throw new Error('HTML导出失败，请重试');
}

clearInterval(htmlTimer);
timerEl.textContent='';
timerEl.style.display='none';

let blob=new Blob([data.html],
{type:'text/html'});

let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=currentIndustry+'_白皮书.html';
a.click();
} catch(e) {
  clearInterval(htmlTimer);
  timerEl.textContent='';
  timerEl.style.display='none';
  alert(e.message);
}

btn.disabled=false;
btn.textContent='生成 HTML';
btn.style.opacity='1';

}


document.getElementById('industryInput')
.addEventListener('keydown',e=>{
if(e.key==='Enter')generateReadable();
});

</script>



<!-- Admin Panel -->
<div id="adminOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center">
<div id="adminPanel" style="background:white;border-radius:12px;padding:40px;max-width:700px;width:90%;max-height:80vh;overflow:auto">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
<h2 style="font-family:'Noto Serif SC';font-size:24px">报告管理</h2>
<button onclick="closeAdmin()" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)">&times;</button>
</div>
<div id="adminContent"></div>
</div>
</div>

<script>
let adminToken='';
let myCode='';
let myCodeInfo=null;

async function doLogin(code){
  try{
    let r=await fetch('/api/auth/status?code='+encodeURIComponent(code));
    let d=await r.json();
    if(!d.valid)return false;
    myCode=code;myCodeInfo=d;
    localStorage.setItem('tg_code',code);
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='inline';
    document.getElementById('myRptBtn').style.display='inline';
    if(d.admin){
      document.getElementById('quotaDisplay').textContent='管理员 · 无限次数';
    }else{
      document.getElementById('quotaDisplay').textContent='网页版'+d.web_left+'次';
    }
    document.getElementById('quotaDisplay').style.display='inline';
    return true;
  }catch(e){return false}
}

async function showLogin(){
  let code=prompt('请输入授权码');
  if(!code)return;
  if(!await doLogin(code)){alert('授权码无效')}
}

function logout(){
  myCode='';myCodeInfo=null;localStorage.removeItem('tg_code');
  document.getElementById('loginBtn').style.display='inline';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('myRptBtn').style.display='none';
  document.getElementById('quotaDisplay').style.display='none';
}

// 页面加载时自动登录
(async function(){
  let saved=localStorage.getItem('tg_code');
  if(saved)await doLogin(saved);
})();

async function showMyReports(){
  if(!myCode)return;
  let c=document.getElementById('adminContent');
  document.getElementById('adminOverlay').style.display='flex';
  c.innerHTML='<p style="color:var(--muted)">加载中…</p>';
  let r=await fetch('/api/auth/my-reports?code='+myCode);
  let data=await r.json();
  if(!data.length){c.innerHTML='<p style="color:var(--muted)">暂无报告</p>';return}
  let html='<h2 style="font-family:\'Noto Serif SC\';font-size:20px;margin-bottom:16px">我的报告</h2>';
  // 同行业去重，保留每个行业最新一条
  let seen=new Set();data=data.filter(d=>{let k=d.industry;if(seen.has(k))return false;seen.add(k);return true});
  if(!data.length){html+='<p style="color:var(--muted)">暂无报告</p>'}
  data.reverse().forEach((d,i)=>{
    let t=new Date(d.time);
    let ts=t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0')+' '+t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    html+='<div style="border:2px solid var(--ink);padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--paper);box-shadow:4px 4px 0 var(--ink)" onclick="window.location.href=\''+d.url+'\'" onmouseover="this.style.background=\'var(--lime)\'" onmouseout="this.style.background=\'var(--paper)\'"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:11px;color:var(--coral);margin-right:8px">[网页版]</span><span style="font-weight:600">'+d.industry+'</span></div><span style="font-size:12px;color:var(--muted)">'+ts+' · 打开 →</span></div></div>';
  });
  c.innerHTML=html;
  window._myData=data;
}

async function loadMyReport(i){
  closeAdmin();
  let d=window._myData[i];
  if(!d.content){alert('报告加载失败，请重新生成');return}
  currentIndustry=d.industry;currentReport=d.content;resetMarkdownMode();
  document.getElementById('reportTitle').textContent=d.industry+' · 行业白皮书';
  document.getElementById('reportContent').innerHTML=marked.parse(d.content);
  document.getElementById('report').classList.add('show');
  setTimeout(()=>document.getElementById('reportContent').scrollIntoView({behavior:'smooth',block:'start'}),200);
}
function showAdmin(){
document.getElementById('adminOverlay').style.display='flex';
let c=document.getElementById('adminContent');
if(myCode!=='trendgrab2026'){c.innerHTML='<p style="color:var(--red)">仅管理员可访问</p>';return}
c.innerHTML='<p style="color:var(--muted)">加载中…</p>';
let html='<div style="display:flex;gap:12px;margin-bottom:20px">';
html+='<button onclick="loadAdminCodes()" id="tabCodes" style="padding:6px 16px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--gold);color:#fff">授权码管理</button>';
html+='<button onclick="loadAdminReports()" id="tabReports" style="padding:6px 16px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg)">所有报告</button>';
html+='</div><div id="adminTabContent"></div>';
c.innerHTML=html;loadAdminCodes();
}
function closeAdmin(){document.getElementById('adminOverlay').style.display='none'}

async function loadAdminCodes(){
document.getElementById('tabCodes').style.background='var(--gold)';document.getElementById('tabCodes').style.color='#fff';
document.getElementById('tabReports').style.background='var(--bg)';document.getElementById('tabReports').style.color='var(--ink)';
let c=document.getElementById('adminTabContent');c.innerHTML='<p style="color:var(--muted)">加载中…</p>';
let r=await fetch('/api/auth/list-codes?token=trendgrab2026');let data=await r.json();
let html='<div style="margin-bottom:16px;display:flex;gap:8px">';
html+='<input id="newWeb" placeholder="网页版次数" value="10" style="width:80px;padding:6px;border:1px solid var(--border);border-radius:0;background:var(--paper)">';
html+='<button onclick="createCode()" style="padding:6px 14px;background:var(--gold);color:var(--ink);border:1px solid var(--ink);border-radius:0;cursor:pointer;box-shadow:3px 3px 0 var(--ink)">生成新码</button></div>';
html+='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="border-bottom:2px solid var(--border)"><th style="text-align:left;padding:8px">授权码</th><th style="text-align:left;padding:8px">网页版剩余</th><th style="text-align:left;padding:8px">报告数</th></tr>';
for(let k in data){let d=data[k];let wl=d.web_left<0?'无限':d.web_left;html+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;font-family:JetBrains Mono,monospace;font-size:11px">'+k+'</td><td style="padding:8px">'+wl+'</td><td style="padding:8px">'+d.report_count+'</td></tr>';}
html+='</table>';c.innerHTML=html;
}

async function createCode(){let w=document.getElementById('newWeb').value||10;let r=await fetch('/api/auth/generate-code?token=trendgrab2026&web='+w,{method:'POST'});let data=await r.json();if(data.code)loadAdminCodes();else alert('失败')}

async function loadAdminReports(){
document.getElementById('tabCodes').style.background='var(--bg)';document.getElementById('tabCodes').style.color='var(--ink)';
document.getElementById('tabReports').style.background='var(--gold)';document.getElementById('tabReports').style.color='#fff';
let c=document.getElementById('adminTabContent');c.innerHTML='<p style="color:var(--muted)">加载中…</p>';
let r=await fetch('/api/admin/reports?token=trendgrab2026');let data=await r.json();
if(!data.length){c.innerHTML='<p style="color:var(--muted)">暂无报告</p>';return}
let html='';data.forEach((d,i)=>{let t=new Date(d.time);let ts=t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0')+' '+t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');html+='<div style="border:2px solid var(--ink);border-radius:0;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--paper);box-shadow:4px 4px 0 var(--ink)" onclick="window.location.href=\''+d.url+'\'" onmouseover="this.style.background=\'var(--lime)\'" onmouseout="this.style.background=\'var(--paper)\'"><div style="display:flex;justify-content:space-between;align-items:center"><div><span style="font-size:11px;color:var(--coral);margin-right:8px">[网页版]</span><span style="font-weight:600">'+d.name+'</span></div><span style="font-size:12px;color:var(--muted)">'+ts+' · 打开 →</span></div></div>'});c.innerHTML=html}
async function loadAdminRpt(p,n){closeAdmin();let s=document.getElementById('status');s.classList.add('show');document.getElementById('statusText').textContent='加载中…';try{let r=await fetch('/api/admin/report-content?token=trendgrab2026&path='+p);let d=await r.json();currentIndustry=n;currentReport=d.content;resetMarkdownMode();document.getElementById('reportTitle').textContent=n+' · 行业白皮书';document.getElementById('reportContent').innerHTML=marked.parse(d.content);document.getElementById('report').classList.add('show')}catch(e){alert(e.message)}s.classList.remove('show')}
async function shareReport(){if(!currentIndustry)return;try{let endpoint=currentReportKind==='readable'?'/api/share-readable':'/api/share';let r=await fetch(endpoint+'?industry='+encodeURIComponent(currentIndustry)+'&code='+encodeURIComponent(myCode),{method:'POST'});let d=await r.json();if(!r.ok)throw new Error(d.detail||'创建失败');let url=window.location.origin+d.url;navigator.clipboard.writeText(url).then(()=>alert('分享链接已复制:\n'+url)).catch(()=>prompt('复制链接:',url));}catch(e){alert('分享失败: '+e.message)}}
</script>

<footer style="text-align:center;padding:20px;color:var(--muted);font-size:11px" id="pageFooter"></footer>
<script>
fetch('/api/version').then(r=>r.json()).then(d=>{document.getElementById('pageFooter').textContent='v'+d.version+' | '+d.date}).catch(()=>{});
</script>
</body>
</html>
